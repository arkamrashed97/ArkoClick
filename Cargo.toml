[package]
name = "arkoclick"
version = "0.4.0"
edition = "2021"
description = "ArkoClick - multi-target background auto clicker for Windows"
authors = ["Arkam Rashed <arko313m@gmail.com>"]
license = "MIT"

[[bin]]
name = "ArkoClick"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
dirs = "5"
ar-reshaper = "1.5"
unicode-bidi = "0.3"
base64 = "0.22"
sha2 = "0.10"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_Globalization",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_Media",
    "Win32_Security",
]

[dev-dependencies]
# Only for examples/make_icons.rs (renders assets/logo.svg into the icon files).
resvg = "0.48"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
