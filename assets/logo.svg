<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>ArkoClick</title>
  <defs>
    <!-- Calm teal-to-slate tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E9C93"/>
      <stop offset="1" stop-color="#2B5464"/>
    </linearGradient>
    <!-- Soft light from the top-left -->
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Warm cream pointer -->
    <linearGradient id="pointer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7F0"/>
      <stop offset="1" stop-color="#EEE4D3"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#glow)"/>

  <!-- Click ripples around the pointer tip -->
  <circle cx="98" cy="98" r="62" fill="none" stroke="#CDEBE3" stroke-opacity="0.28" stroke-width="11"/>
  <circle cx="98" cy="98" r="38" fill="none" stroke="#CDEBE3" stroke-opacity="0.55" stroke-width="11"/>
  <circle cx="98" cy="98" r="13" fill="#F6C99A"/>

  <!-- Pointer: soft shadow, then body -->
  <path d="M106 112 L106 214 L131 190 L150 232 L174 221 L155 180 L191 178 Z"
        fill="#16323B" fill-opacity="0.28" stroke="#16323B" stroke-opacity="0.28" stroke-width="10" stroke-linejoin="round"/>
  <path d="M100 104 L100 206 L125 182 L144 224 L168 213 L149 172 L185 170 Z"
        fill="url(#pointer)" stroke="#21414C" stroke-width="7" stroke-linejoin="round"/>
</svg>
